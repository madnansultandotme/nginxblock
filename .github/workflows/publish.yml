name: Publish package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nginxblock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "nginxblock@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "nginxblock@$version is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "nginxblock@$version is not published; continuing."
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public